<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 900" preserveAspectRatio="xMidYMid meet">
  <defs>
    <g id="leaf"><path d="M0 0 C 14 -10, 34 -8, 44 0 C 34 8, 14 10, 0 0 Z"/></g>
    <g id="flower">
      <g fill="#ecc3c6">
        <ellipse rx="8" ry="14" cy="-12"/>
        <ellipse rx="8" ry="14" cy="-12" transform="rotate(72)"/>
        <ellipse rx="8" ry="14" cy="-12" transform="rotate(144)"/>
        <ellipse rx="8" ry="14" cy="-12" transform="rotate(216)"/>
        <ellipse rx="8" ry="14" cy="-12" transform="rotate(288)"/>
      </g>
      <circle r="5" fill="#d98e95"/>
    </g>
    <g id="bud"><ellipse rx="6" ry="10" fill="#e3a9ae"/><path d="M-6 4 Q0 14 6 4" fill="#a9b894"/></g>
  </defs>

  <!-- стебель -->
  <path d="M110 900 C 90 760, 130 640, 100 520 S 80 300, 110 170 S 100 60, 96 20"
        fill="none" stroke="#a9b894" stroke-width="3" stroke-linecap="round"/>
  <path d="M104 470 C 70 440, 55 400, 50 360" fill="none" stroke="#a9b894" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M112 690 C 145 660, 160 620, 158 580" fill="none" stroke="#a9b894" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M104 250 C 135 225, 150 200, 150 170" fill="none" stroke="#a9b894" stroke-width="2" stroke-linecap="round"/>

  <!-- листья -->
  <g fill="#bccaa8">
    <use href="#leaf" transform="translate(108 800) rotate(-30)"/>
    <use href="#leaf" transform="translate(106 740) rotate(200)"/>
    <use href="#leaf" transform="translate(114 610) rotate(-20)"/>
    <use href="#leaf" transform="translate(100 560) rotate(195)"/>
    <use href="#leaf" transform="translate(96 400) rotate(-35)"/>
    <use href="#leaf" transform="translate(100 330) rotate(210)"/>
    <use href="#leaf" transform="translate(106 200) rotate(-25)"/>
    <use href="#leaf" transform="translate(104 120) rotate(205)"/>
  </g>

  <!-- цветы и бутоны -->
  <use href="#flower" transform="translate(96 20) scale(1.3)"/>
  <use href="#flower" transform="translate(50 356) scale(1.1) rotate(20)"/>
  <use href="#flower" transform="translate(158 576) rotate(-10)"/>
  <use href="#bud" transform="translate(150 164) rotate(15)"/>
  <use href="#bud" transform="translate(66 470) rotate(-40)"/>
</svg>
