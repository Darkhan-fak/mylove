<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Для тебя</title>
  <link rel="icon" href="assets/flowers/bloom.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- ?v=... в адресах — чтобы браузер не показывал старую копию после обновления сайта.
       При правке css/js меняй метку: тогда браузер точно возьмёт новые файлы. -->
  <link rel="stylesheet" href="css/style.css?v=20261009a">
</head>
<body>
  <aside class="side side--left" aria-hidden="true"></aside>
  <main id="app" class="app"></main>
  <aside class="side side--right" aria-hidden="true"></aside>
  <div class="garden" aria-hidden="true"><span class="garden__note"></span></div>

  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal__x" type="button" data-close aria-label="Закрыть">×</button>
      <h2 class="modal__title" id="modal-title"></h2>
      <div class="modal__body"></div>
    </div>
  </div>

  <div class="viewer" id="viewer" hidden>
    <div class="viewer__backdrop" data-viewer-close></div>
    <button class="viewer__x" type="button" data-viewer-close aria-label="Закрыть">×</button>
    <button class="viewer__nav viewer__nav--prev" type="button" data-step="-1" aria-label="Предыдущее">‹</button>
    <figure class="viewer__frame">
      <img class="viewer__img" alt="">
      <figcaption>
        <p class="viewer__caption"></p>
        <p class="viewer__meta"></p>
        <div class="viewer__tools">
          <button class="icon-btn" type="button" data-caption>Подписать</button>
          <button class="icon-btn" type="button" data-remove>Удалить</button>
        </div>
      </figcaption>
    </figure>
    <button class="viewer__nav viewer__nav--next" type="button" data-step="1" aria-label="Следующее">›</button>
  </div>

  <script src="js/config.js?v=20261009a"></script>
  <script src="js/store.js?v=20261009a"></script>
  <script src="js/app.js?v=20261009a"></script>
</body>
</html>
